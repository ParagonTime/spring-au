plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.hibernate.orm' version '7.2.7.Final'
}

bootJar { enabled = false }

subprojects {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'

	group = 'org.pr.project'
	version = '0.0.1-SNAPSHOT'

	java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

	repositories { mavenCentral() }

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}
}

tasks.register('startAll') {
	group = 'application'
	description = 'Сборка всех модулей и запуск через Docker Compose'

	// Сначала заставляем Gradle собрать jar-файлы обоих сервисов
	dependsOn ':auth:bootJar', ':app:bootJar'

	doLast {
		exec {
			// Запускаем сборку образов и поднятие контейнеров
			commandLine 'docker-compose', 'up', '--build'
		}
	}
}
