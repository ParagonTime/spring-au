apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-storage-pvc
  namespace: dev
  labels:
    app: victoria-metrics
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: dev
  labels:
    app: victoria-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.130.0
          imagePullPolicy: IfNotPresent
          args:
            - "--storageDataPath=/storage"
            - "--retentionPeriod=12"
          ports:
            - name: http
              containerPort: 8428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: storage-volume
              mountPath: /storage
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: vm-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: dev
  labels:
    app: victoria-metrics
spec:
  selector:
    app: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
      protocol: TCP
  type: ClusterIP