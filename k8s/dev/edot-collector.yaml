apiVersion: v1
kind: ConfigMap
metadata:
  name: edot-collector-config
  namespace: dev
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      elasticsearch/otel:
        endpoints:
          - https://elasticsearch-es-http.dev.svc.cluster.local:9200
        user: elastic
        password: ${env:ELASTICSEARCH_PASSWORD}
        mapping:
          mode: otel
        tls:
          ca_file: /etc/elastic/certs/ca.crt

      debug:
        verbosity: basic

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [elasticsearch/otel, debug]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [elasticsearch/otel, debug]

        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [elasticsearch/otel, debug]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edot-collector
  namespace: dev
  labels:
    app: edot-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edot-collector
  template:
    metadata:
      labels:
        app: edot-collector
    spec:
      containers:
        - name: edot-collector
          image: otel/opentelemetry-collector-contrib:0.136.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/edot/config.yaml"
          env:
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/edot
              readOnly: true
            - name: elasticsearch-ca
              mountPath: /etc/elastic/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edot-collector-config
        - name: elasticsearch-ca
          secret:
            secretName: elasticsearch-es-http-ca-internal

---
apiVersion: v1
kind: Service
metadata:
  name: edot-collector
  namespace: dev
  labels:
    app: edot-collector
spec:
  selector:
    app: edot-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
  type: ClusterIP