apiVersion: v1
kind: ConfigMap
metadata:
  name: edot-collector-config
  namespace: dev
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      elasticsearch:
        endpoints: ["http://elasticsearch:9200"]
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [elasticsearch, debug]
        metrics:
          receivers: [otlp]
          exporters: [elasticsearch, debug]
        logs:
          receivers: [otlp]
          exporters: [elasticsearch, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edot-collector
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edot-collector
  template:
    metadata:
      labels:
        app: edot-collector
    spec:
      containers:
        - name: edot-collector
          image: otel/opentelemetry-collector-contrib:0.136.0
          args: ["--config=/etc/edot/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/edot
      volumes:
        - name: config
          configMap:
            name: edot-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: edot-collector
  namespace: dev
spec:
  selector:
    app: edot-collector
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http