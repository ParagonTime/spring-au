apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: dev
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 512
        spike_limit_mib: 128

      batch:
        timeout: 5s
        send_batch_size: 100

    exporters:
      otlphttp/victoria-metrics:
        metrics_endpoint: http://victoria-metrics.dev.svc.cluster.local:8428/opentelemetry/v1/metrics
        encoding: proto

      otlphttp/victoria-logs:
        logs_endpoint: http://victoria-logs.dev.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        encoding: proto

      otlphttp/victoria-traces:
        traces_endpoint: http://victoria-traces.dev.svc.cluster.local:10428/insert/opentelemetry/v1/traces
        encoding: proto

      debug:
        verbosity: basic

    service:
      pipelines:
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlphttp/victoria-metrics
            - debug

        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlphttp/victoria-logs
            - debug

        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlphttp/victoria-traces
            - debug

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: dev
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.136.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/otel/config.yaml"
          ports:
            - name: grpc
              containerPort: 4317
              protocol: TCP
            - name: http
              containerPort: 4318
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: dev
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 4318
      targetPort: http
      protocol: TCP
  type: ClusterIP