apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: dev
data:
  config.yaml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/otel-collector/*.log
        start_at: end
        include_file_path: true
        include_file_name: false

        operators:
          - type: container
            id: container-parser

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
            - k8s.node.name

      batch:
        timeout: 10s
        send_batch_size: 512

    exporters:
      elasticsearch:
        endpoints:
          - http://elasticsearch.dev.svc.cluster.local:9200
        mapping:
          mode: otel
        flush:
          interval: 10s
        retry:
          enabled: true
          initial_interval: 5s
          max_interval: 30s

      debug:
        verbosity: basic

    service:
      pipelines:
        logs:
          receivers:
            - filelog
            - otlp
          processors:
            - memory_limiter
            - k8sattributes
            - batch
          exporters:
            - elasticsearch
            - debug

        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - elasticsearch

        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - elasticsearch

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: dev

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: dev

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: dev
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector

      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.136.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/otel/config.yaml"

          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true

            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true

            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true

          readinessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

      volumes:
        - name: config
          configMap:
            name: otel-collector-config

        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory

        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: dev
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
  type: ClusterIP