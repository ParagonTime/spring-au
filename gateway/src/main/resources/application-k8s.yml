server:
  port: 8080

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/task-realm

management:
  server:
    port: 8090

  tracing:
    sampling:
      probability: 1.0

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

    prometheus:
      enabled: true

logging:
  structured:
    format:
      console: ecs

  level:
    org.springframework.cloud.gateway: DEBUG