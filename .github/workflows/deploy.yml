name: Deploy to K8s

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew bootJar

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/gateway:dev ./gateway
          docker build -t ghcr.io/${{ github.repository_owner }}/auth:dev ./auth
          docker build -t ghcr.io/${{ github.repository_owner }}/app:dev ./app
          docker build -t ghcr.io/${{ github.repository_owner }}/search:dev ./search

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/gateway:dev
          docker push ghcr.io/${{ github.repository_owner }}/auth:dev
          docker push ghcr.io/${{ github.repository_owner }}/app:dev
          docker push ghcr.io/${{ github.repository_owner }}/search:dev

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/dev/
          kubectl rollout restart deployment -n dev